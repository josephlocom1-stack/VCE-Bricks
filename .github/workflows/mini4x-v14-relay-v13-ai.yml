name: Temporary Mini4X V13 AI Relay
on:
  push:
    branches: [mini4x-public-qa-temp]
    paths: ['.github/workflows/mini4x-v14-relay-v13-ai.yml']
permissions:
  contents: read
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Capture V13 AI inputs
        shell: bash
        run: |
          set -euo pipefail
          fetch(){ mkdir -p "$(dirname "$1")"; curl --connect-timeout 10 --max-time 30 -fsSL "$2" -o "$1"; test -s "$1"; }
          fetch v13-ai/apply_v13_ai.py 'https://raw.githubusercontent.com/josephlocom1-stack/Backfill/mini4x-v14-ai-production/v13-ai/apply_v13_ai.py?token=BXN2EFKDY5UT6YLYJNOC623KQL4IJAA'
          fetch v13-ai/safe-sources/production_master.webp.b64.000 'https://raw.githubusercontent.com/josephlocom1-stack/Backfill/mini4x-v14-ai-production/v13-ai/safe-sources/production_master.webp.b64.000?token=BXN2EFKIKFTNQGR6D7LVYRDKQL4IVAA'
