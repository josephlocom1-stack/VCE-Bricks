name: Mini4X V1.4 Emulator-Only Input-Ready Retry

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: {name: Mini4X-v1.4-corrected-semantic-evidence, path: source-evidence, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32030746187'}

      - uses: actions/download-artifact@v4
        with: {name: mini4x-qa-harness, path: relay/qa-harness, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32028004472'}

      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Verify Intel runner and assemble exact locked APK harness
        shell: bash
        run: |
          set -euo pipefail
          host_arch="$(uname -m)"
          test "$host_arch" = x86_64
          echo "host_arch=$host_arch"
          tar -xzf relay/qa-harness/mini4x-qa-harness.tar.gz
          mkdir -p project/app/build/outputs/apk/debug
          cp source-evidence/Mini4X-v1.4-semantic-qa.apk project/app/build/outputs/apk/debug/app-debug.apk
          actual="$(shasum -a 256 project/app/build/outputs/apk/debug/app-debug.apk | awk '{print $1}')"
          expected=3b821eb191165b5398fe7c3f5d8fc1f8d81bd66c87ffa4dc9debabff33047217
          test "$actual" = "$expected"
          printf '%s  %s\n' "$actual" project/app/build/outputs/apk/debug/app-debug.apk > qa_apk_sha256.txt
          python qa/patch_mini4x_public_harness.py qa/mini4x_emulator_flow.sh
          bash -n qa/mini4x_emulator_flow.sh
          grep -q 'settings put global hide_error_dialogs 1' qa/mini4x_emulator_flow.sh
          grep -q 'android.intent.action.CLOSE_SYSTEM_DIALOGS' qa/mini4x_emulator_flow.sh
          grep -q 'wait_input_ready(){' qa/mini4x_emulator_flow.sh
          grep -q 'adb shell input tap 12 12' qa/mini4x_emulator_flow.sh
          grep -q 'wait_input_ready "$scenario_screen"' qa/mini4x_emulator_flow.sh
          grep -q 'wait_input_ready TITLE' qa/mini4x_emulator_flow.sh
          grep -q 'tap_expect TITLE 540 1416' qa/mini4x_emulator_flow.sh
          ! grep -q 'tap_expect SETUP 540 1416' qa/mini4x_emulator_flow.sh
          python -m pip install --disable-pip-version-check --quiet pillow
          echo exact_locked_apk_harness=PASS

      - name: Enable portable GNU command bounds
        shell: bash
        run: |
          set -euo pipefail
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Run exact locked APK 31-screen Android 16 player flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash qa/mini4x_emulator_flow.sh

      - name: Collect semantic evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p visual-review-out public-evidence
          count=$(find screenshots-pass2 -name '*.png' -size +1000c 2>/dev/null | wc -l | tr -d ' ')
          echo "$count" > public-evidence/RAW_SCREENSHOT_COUNT.txt
          if [ "$count" -gt 0 ]; then python qa/build_visual_evidence.py screenshots-pass2 visual-review-out "$count" || true; fi
          cp -R screenshots-pass2 public-evidence/ 2>/dev/null || true
          cp -R visual-review-out public-evidence/ 2>/dev/null || true
          cp qa_apk_sha256.txt pass2_progress.txt pass2_meminfo.txt pass2_gfxinfo.txt pass2_crashes.txt pass2_logcat.txt public-evidence/ 2>/dev/null || true
          cat > public-evidence/PROVENANCE.txt <<'EOF'
          locked_private_product_checkpoint=34ed65d70f2ee23f97700b4942be54f191409632
          candidate_contract=locked_16_stage_result_new_game_to_title
          source_build_semantic_run=32030746187
          source_build_artifact=9289338969
          source_apk_sha256=3b821eb191165b5398fe7c3f5d8fc1f8d81bd66c87ffa4dc9debabff33047217
          qa_harness_relay_run=32028004472
          harness_fix=system_dialog_guard_plus_real_input_readiness
          product_candidate_changed=false
          EOF
          printf 'public_runner_repo=%s\npublic_runner_run=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> public-evidence/PROVENANCE.txt

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mini4X-v1.4-input-ready-semantic-evidence
          path: public-evidence/
          retention-days: 1
          if-no-files-found: error
