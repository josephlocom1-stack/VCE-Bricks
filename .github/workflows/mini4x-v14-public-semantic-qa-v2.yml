name: Corrected Public Mini4X V1.4 Semantic QA

on:
  push:
    branches: [mini4x-public-qa-temp]
    paths: ['.github/workflows/mini4x-v14-public-semantic-qa-v2.yml']

permissions:
  contents: read
  actions: read

jobs:
  qa:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: mini4x-buildsrc, path: relay/buildsrc, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027530759'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-generator, path: relay/generator, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027780110'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v12, path: relay/v12, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027823008'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v13-ai, path: relay/v13-ai, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027879200'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v13-qa, path: relay/v13-qa, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027906449'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v14-scripts, path: relay/v14-scripts, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027949459'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v14-assets, path: relay/v14-assets, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027974246'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-qa-harness, path: relay/qa-harness, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32028004472'}

      - name: Assemble exact relayed inputs
        shell: bash
        run: |
          set -euo pipefail
          for f in relay/*/*.tar.gz; do tar -xzf "$f"; done
          test -s buildsrc/noassets.00.b64
          test -s buildsrc/noassets.09.b64
          test -s final-generator/generator.00.part
          test -s v12-patch/apply_v12.py
          test -s v13-ai/apply_v13_ai.py
          test -s v13-qa/apply_v13_qa.py
          test -s v14-ai/apply_v14_safe_new_game.py
          test -s qa/inject_emulator_scenarios.py
          test -s qa/mini4x_emulator_flow.sh
          echo relay_artifact_assembly=PASS

      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Enable portable GNU command bounds
        shell: bash
        run: |
          set -euo pipefail
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          CORE="$(brew --prefix coreutils)/libexec/gnubin"
          echo "$CORE" >> "$GITHUB_PATH"

      - name: Reconstruct exact locked 16-stage candidate
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python -m pip install --disable-pip-version-check --quiet pillow numpy
          cat buildsrc/noassets.00.b64 buildsrc/noassets.01.b64 buildsrc/noassets.02.b64 buildsrc/noassets.03.b64 buildsrc/noassets.04a.b64 buildsrc/noassets.04b.b64 buildsrc/noassets.05.b64 buildsrc/noassets.06.b64 buildsrc/noassets.07.b64 buildsrc/noassets.08a.b64 buildsrc/noassets.08b.b64 buildsrc/noassets.09.b64 | base64 -d >/tmp/src.zip
          unzip -t /tmp/src.zip >/dev/null
          rm -rf project && mkdir project && unzip -q /tmp/src.zip -d project
          cat final-generator/generator.*.part >/tmp/generate.py
          mkdir -p project/app/src/main/assets/mini4x/atlases
          python /tmp/generate.py project/app/src/main/assets/mini4x/atlases >/dev/null
          export MINI4X_PROJECT=project
          for patch in \
            v12-patch/apply_v12.py \
            v13-ai/apply_v13_ai.py \
            v13-qa/apply_v13_qa.py \
            v14-ai/apply_v14_full_roster_ai.py \
            v14-ai/apply_v14_ai_quality.py \
            v14-ai/apply_v14_play_ready.py \
            v13-qa/apply_directional_facing.py \
            v13-qa/apply_v13_ui_review_fixes.py \
            v13-qa/apply_v13_action_review_fixes.py \
            v14-ai/apply_v14_diplomacy_ui.py \
            v14-ai/apply_v14_tile_actions_ui.py \
            v14-ai/apply_v14_result_lifecycle.py \
            v14-ai/apply_v14_command_reachability.py \
            v14-ai/apply_v14_game_flow_lifecycle.py \
            v14-ai/apply_v14_selection_lifecycle.py \
            v14-ai/apply_v14_safe_new_game.py; do
              python "$patch"
          done
          python qa/inject_emulator_scenarios.py
          grep -q 'versionName = "1.4.0"' project/app/build.gradle.kts
          grep -q 'versionCode = 15' project/app/build.gradle.kts
          grep -q 'compileSdk = 36' project/app/build.gradle.kts
          grep -q 'targetSdk = 36' project/app/build.gradle.kts
          grep -q '8.10.1' project/build.gradle.kts
          grep -q 'DIPLOMACY' project/app/src/main/java/com/example/mini4x/presentation/GamePresenter.kt
          grep -q 'private fun drawDiplomacy' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          grep -q 'private fun tileContextLabel' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          grep -q 'private fun reconcileSelectionAfterCommand' project/app/src/main/java/com/example/mini4x/presentation/GamePresenter.kt
          grep -q 'preserve current save until START GAME' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          test -s project/app/src/main/assets/mini4x/v14_full_roster_ai_manifest.json
          test -s project/app/src/main/assets/mini4x/v14_naval_ai_master.webp
          test -s project/app/src/main/assets/mini4x/v14_raft_styleA_locked.png
          echo exact_16_stage_reconstruction=PASS

      - name: Build sign and inspect Android 16 V1.4 QA APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p project :app:assembleDebug
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | tee qa_badging.txt
          grep -q "package: name='com.mini4x.game'" qa_badging.txt
          grep -q "versionCode='15'" qa_badging.txt
          grep -q "versionName='1.4.0'" qa_badging.txt
          grep -q "targetSdkVersion:'36'" qa_badging.txt
          shasum -a 256 "$APK" | tee qa_apk_sha256.txt

      - name: Run actual APK 31-screen Android 16 player flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash qa/mini4x_emulator_flow.sh

      - name: Collect semantic evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p visual-review-out public-evidence
          count=$(find screenshots-pass2 -name '*.png' -size +1000c 2>/dev/null | wc -l | tr -d ' ')
          echo "$count" > public-evidence/RAW_SCREENSHOT_COUNT.txt
          if [ "$count" -gt 0 ]; then python qa/build_visual_evidence.py screenshots-pass2 visual-review-out "$count" || true; fi
          cp -R screenshots-pass2 public-evidence/ 2>/dev/null || true
          cp -R visual-review-out public-evidence/ 2>/dev/null || true
          cp qa_badging.txt qa_apk_sha256.txt pass2_progress.txt pass2_meminfo.txt pass2_gfxinfo.txt pass2_crashes.txt pass2_logcat.txt public-evidence/ 2>/dev/null || true
          cp project/app/build/outputs/apk/debug/app-debug.apk public-evidence/Mini4X-v1.4-semantic-qa.apk 2>/dev/null || true
          cat > public-evidence/PROVENANCE.txt <<'EOF'
          locked_private_product_checkpoint=34ed65d70f2ee23f97700b4942be54f191409632
          relay_buildsrc_run=32027530759
          relay_generator_run=32027780110
          relay_v12_run=32027823008
          relay_v13_ai_run=32027879200
          relay_v13_qa_run=32027906449
          relay_v14_scripts_run=32027949459
          relay_v14_assets_run=32027974246
          relay_qa_harness_run=32028004472
          reconstruction_sanity_run=32030440291
          EOF
          printf 'public_runner_repo=%s\npublic_runner_run=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> public-evidence/PROVENANCE.txt

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mini4X-v1.4-corrected-semantic-evidence
          path: public-evidence/
          retention-days: 1
          if-no-files-found: error
