name: Temporary Mini4X APK Relay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-mini4x-apk-relay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Fetch, verify, and commit exact APK temporarily
        shell: bash
        run: |
          set -euo pipefail
          URL='https://litter.catbox.moe/x23wxr.apk'
          EXPECTED='031a5be4908e1521fa6ee12f91b942c281128bbea50cac0e75057a2e58735e64'
          mkdir -p temporary-mini4x-relay
          curl --connect-timeout 15 --max-time 90 --fail --silent --show-error -L \
            "$URL" -o temporary-mini4x-relay/Mini4X-v1.1-final-test.apk
          ACTUAL="$(sha256sum temporary-mini4x-relay/Mini4X-v1.1-final-test.apk | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          unzip -t temporary-mini4x-relay/Mini4X-v1.1-final-test.apk
          printf '%s  Mini4X-v1.1-final-test.apk\n' "$ACTUAL" > temporary-mini4x-relay/SHA256SUMS.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add temporary-mini4x-relay/
          git commit -m 'Temporary verified Mini4X APK relay [skip ci]'
          git push
