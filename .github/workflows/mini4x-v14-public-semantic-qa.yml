name: Temporary Public Mini4X V1.4 Semantic QA

on:
  push:
    branches: [mini4x-public-qa-temp]
    paths:
      - '.github/workflows/mini4x-v14-public-semantic-qa.yml'

permissions:
  contents: read

jobs:
  qa:
    runs-on: macos-15-intel
    timeout-minutes: 45
