      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.11.1'}
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Enable portable GNU command bounds
        shell: bash
        run: |
          set -euo pipefail
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          CORE="$(brew --prefix coreutils)/libexec/gnubin"
          echo "$CORE" >> "$GITHUB_PATH"

      - name: Reconstruct exact locked V1.4 QA candidate
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          python -m pip install --disable-pip-version-check --quiet pillow numpy
          cat buildsrc/noassets.00.b64 buildsrc/noassets.01.b64 buildsrc/noassets.02.b64 buildsrc/noassets.03.b64 buildsrc/noassets.04a.b64 buildsrc/noassets.04b.b64 buildsrc/noassets.05.b64 buildsrc/noassets.06.b64 buildsrc/noassets.07.b64 buildsrc/noassets.08a.b64 buildsrc/noassets.08b.b64 buildsrc/noassets.09.b64 | base64 -d >/tmp/src.zip
          unzip -t /tmp/src.zip >/dev/null
          rm -rf project && mkdir project && unzip -q /tmp/src.zip -d project
          cat final-generator/generator.*.part >/tmp/generate.py
          mkdir -p project/app/src/main/assets/mini4x/atlases
          python /tmp/generate.py project/app/src/main/assets/mini4x/atlases >/dev/null
          MINI4X_PROJECT=project python v12-patch/apply_v12.py >/dev/null
          MINI4X_PROJECT=project python v13-ai/apply_v13_ai.py >/dev/null
          MINI4X_PROJECT=project python v13-qa/apply_v13_qa.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_full_roster_ai.py | tee v14_ai_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_ai_quality.py | tee ai_quality_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_play_ready.py | tee play_ready_log.txt
          MINI4X_PROJECT=project python v13-qa/apply_directional_facing.py >/dev/null
          MINI4X_PROJECT=project python v13-qa/apply_v13_ui_review_fixes.py | tee ui_fix_log.txt
          MINI4X_PROJECT=project python v13-qa/apply_v13_action_review_fixes.py | tee action_fix_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_diplomacy_ui.py | tee diplomacy_ui_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_tile_actions_ui.py | tee tile_actions_ui_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_result_lifecycle.py | tee result_lifecycle_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_command_reachability.py | tee command_reachability_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_game_flow_lifecycle.py | tee game_flow_lifecycle_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_selection_lifecycle.py | tee selection_lifecycle_log.txt
          MINI4X_PROJECT=project python v14-ai/apply_v14_safe_new_game.py | tee safe_new_game_log.txt
          MINI4X_PROJECT=project python qa/inject_emulator_scenarios.py
          grep -q 'versionName = "1.4.0"' project/app/build.gradle.kts
          grep -q 'versionCode = 15' project/app/build.gradle.kts
          grep -q 'compileSdk = 36' project/app/build.gradle.kts
          grep -q 'targetSdk = 36' project/app/build.gradle.kts
          grep -q '8.10.1' project/build.gradle.kts
          grep -q 'Never break peace while our units are still inside' project/app/src/main/java/com/example/mini4x/ai/StrategicAi.kt
          grep -q 'criticalThreat' project/app/src/main/java/com/example/mini4x/ai/StrategicAi.kt
          grep -q 'ScreenMode.DIPLOMACY' project/app/src/main/java/com/example/mini4x/presentation/GamePresenter.kt
          grep -q 'private fun drawDiplomacy' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          grep -q 'private fun tileContextLabel' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          grep -q 'private fun reconcileSelectionAfterCommand' project/app/src/main/java/com/example/mini4x/presentation/GamePresenter.kt
          grep -q 'preserve current save until START GAME' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          test -s project/app/src/main/assets/mini4x/v14_full_roster_ai_manifest.json
          test -s project/app/src/main/assets/mini4x/v14_naval_ai_master.webp
          test -s project/app/src/main/assets/mini4x/v14_raft_styleA_locked.png
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('project/app/src/main/assets/mini4x/v14_full_roster_ai_manifest.json').read_text())
          assert len(m['units'])==40, len(m['units'])
          statuses={x['status'] for x in m['units'].values()}
          assert statuses <= {'ai_authored_source','accepted_locked_source'}, statuses
          locked=sorted(k for k,v in m['units'].items() if v['status']=='accepted_locked_source')
          assert locked==['asteria_raft','emberhold_raft','sunspire_raft','virelia_raft'], locked
          assert m.get('raft_source_sha256')=='d266d0ce76ae53ddd08a98ce0ee2eac4aa4b3c97d1bda6274f35f5bd848f9093'
          PY
          echo 'candidate_reconstruction=PASS'

      - name: Build sign and inspect Android 16 V1.4 QA APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p project :app:assembleDebug
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | tee qa_badging.txt
          grep -q "package: name='com.mini4x.game'" qa_badging.txt
          grep -q "versionCode='15'" qa_badging.txt
          grep -q "versionName='1.4.0'" qa_badging.txt
          grep -q "targetSdkVersion:'36'" qa_badging.txt
          shasum -a 256 "$APK" | tee qa_apk_sha256.txt

      - name: Run actual APK 31-screen Android 16 player flow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash qa/mini4x_emulator_flow.sh

      - name: Collect semantic evidence
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p visual-review-out public-evidence
          count=$(find screenshots-pass2 -name '*.png' -size +1000c 2>/dev/null | wc -l | tr -d ' ')
          echo "$count" > public-evidence/RAW_SCREENSHOT_COUNT.txt
          if [ "$count" -gt 0 ]; then
            python qa/build_visual_evidence.py screenshots-pass2 visual-review-out "$count" || true
          fi
          cp -R screenshots-pass2 public-evidence/ 2>/dev/null || true
          cp -R visual-review-out public-evidence/ 2>/dev/null || true
          cp qa_badging.txt qa_apk_sha256.txt v14_ai_log.txt ai_quality_log.txt play_ready_log.txt ui_fix_log.txt action_fix_log.txt diplomacy_ui_log.txt tile_actions_ui_log.txt result_lifecycle_log.txt command_reachability_log.txt game_flow_lifecycle_log.txt selection_lifecycle_log.txt safe_new_game_log.txt pass2_progress.txt pass2_meminfo.txt pass2_gfxinfo.txt pass2_crashes.txt pass2_logcat.txt public-evidence/ 2>/dev/null || true
          cp project/app/build/outputs/apk/debug/app-debug.apk public-evidence/Mini4X-v1.4-semantic-qa.apk 2>/dev/null || true
          printf 'public_runner_repo=%s\npublic_runner_run=%s\nlocked_private_product_checkpoint=34ed65d70f2ee23f97700b4942be54f191409632\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > public-evidence/PROVENANCE.txt

      - name: Upload semantic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mini4X-v1.4-public-semantic-evidence
          path: public-evidence/
          retention-days: 1
          if-no-files-found: error
