name: Temporary Public Mini4X V1.4 Semantic QA
on:
  push:
    branches: [mini4x-public-qa-temp]
    paths: ['.github/workflows/mini4x-v14-public-semantic-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Test freshly issued private download
        shell: bash
        run: |
          set -euo pipefail
          curl --connect-timeout 10 --max-time 30 -fsSL 'https://raw.githubusercontent.com/josephlocom1-stack/Backfill/mini4x-v14-ai-production/buildsrc/noassets.00.b64?token=BXN2EFMGWBMTKXWYZLDJJQDKQL3CRAA' -o /tmp/probe.b64
          test "$(wc -c </tmp/probe.b64 | tr -d ' ')" -eq 10000
          echo private_fresh_url=PASS
