name: Mini4X APK public artifact relay
permissions:
  contents: read
on:
  push:
    branches: [mini4x-apk-relay]
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify compiled APK
        run: |
          set -euxo pipefail
          APK=relay/Mini4X-v1.1-skeleton.apk
          echo '6b5e5d7549bf9ed2ecf62e04dfadd18f4de2d2478fdbb0e2b6cd5bfcf1982e71  relay/Mini4X-v1.1-skeleton.apk' | sha256sum -c -
          unzip -t "$APK"
      - name: Upload APK relay artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mini4X-v1.1-skeleton-public-relay
          path: relay/Mini4X-v1.1-skeleton.apk
          compression-level: 0
          retention-days: 1
