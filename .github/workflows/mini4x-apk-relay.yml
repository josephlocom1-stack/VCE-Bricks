name: Mini4X Android signing tools relay
permissions:
  contents: read
on:
  push:
    branches: [mini4x-apk-relay]
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: android-actions/setup-android@v3
      - name: Install official Android build tools
        run: |
          set -euxo pipefail
          sdkmanager "build-tools;35.0.0"
          mkdir -p relay_tools/lib
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" relay_tools/zipalign
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" relay_tools/apksigner
          cp "$ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" relay_tools/lib/apksigner.jar
          chmod +x relay_tools/zipalign relay_tools/apksigner
          sha256sum relay_tools/zipalign relay_tools/apksigner relay_tools/lib/apksigner.jar
      - name: Upload official Android signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing
          path: relay_tools
          compression-level: 0
          retention-days: 1
