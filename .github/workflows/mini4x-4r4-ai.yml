name: Mini4X Phase 4R.4 AI Quality Gate

on:
  push:
    branches: [mini4x-public-qa-temp]
    paths:
      - 'mini4x-4r4/RUN4'

permissions:
  contents: read

jobs:
  phase4r4-selfplay:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Kotlin 1.9.0
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v1.9.0/kotlin-compiler-1.9.0.zip
          unzip -q /tmp/kotlin.zip -d /tmp/kotlin
          echo "/tmp/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Complete Phase 4R.4 self-play soak
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee phase4r4-selfplay-results.txt) 2>&1
          rm -rf /tmp/m4x /tmp/ai
          cp -a mini4x-4r2/sim /tmp/m4x
          mkdir -p /tmp/ai
          cat mini4x-4r4/StrategicAi.part1 mini4x-4r4/StrategicAi.part2 > /tmp/ai/StrategicAi.kt
          SIM=/tmp/m4x
          AI=/tmp/ai
          HAR=mini4x-4r4/harness

          # Same lexical-only relay normalization and exact retained source used by run 33309823964.
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/m4x')
          p=root/'CommandEngine.kt';s=p.read_text();assert 'return"' in s;s=s.replace('return"','return "').replace('"else','" else');p.write_text(s)
          p=root/'MapGenerator.kt';s=p.read_text();old='val fac=FactionCatalog[config.factionIds[t.climateOwner]]; fun mult(r:Resource)=fac.resourceMultipliers[r]?:1.0; val r=hash(config.seed,x,y,501)';assert s.count(old)==1;new='val fac=FactionCatalog[config.factionIds[t.climateOwner]]\n            fun mult(r:Resource)=fac.resourceMultipliers[r]?:1.0\n            val r=hash(config.seed,x,y,501)';p.write_text(s.replace(old,new,1))
          ai=Path('/tmp/ai/StrategicAi.kt');a=ai.read_text();marker='\nobject BaselineAi {';assert marker in a;ai.write_text(a.split(marker,1)[0].rstrip()+'\n')
          print('relay_format_normalization=PASS')
          PY

          python mini4x-4r2/patch_4r2.py "$SIM"
          python mini4x-4r3/patch_4r3.py "$SIM"

          grep -Fq 'val beam=when(difficulty){1->4;2->6;3->9;else->12}' "$AI/StrategicAi.kt"
          grep -Fq 'val second=when(difficulty){1->1;2->2;3->4;else->6}' "$AI/StrategicAi.kt"
          echo 'ai_budget_contract=PASS attempts=16,24,36,50 search_copies=8,18,45,84'

          kotlinc "$SIM"/*.kt "$AI"/*.kt \
            mini4x-4r2/harness/SimInvariantAudit.kt \
            "$HAR/AiSelfPlaySoakHarness.kt" \
            -d /tmp/phase4r4-selfplay.jar
          echo phase4r4_selfplay_compile=PASS

          kotlin -classpath /tmp/phase4r4-selfplay.jar com.example.mini4x.research.AiSelfPlaySoakHarness 8 80 0 > /tmp/selfplay-0.log 2>&1 &
          p0=$!
          kotlin -classpath /tmp/phase4r4-selfplay.jar com.example.mini4x.research.AiSelfPlaySoakHarness 8 80 8 > /tmp/selfplay-8.log 2>&1 &
          p8=$!
          set +e
          wait "$p0"; s0=$?
          wait "$p8"; s8=$?
          set -e
          cat /tmp/selfplay-0.log
          cat /tmp/selfplay-8.log
          test "$s0" -eq 0
          test "$s8" -eq 0
          grep -Fq 'ai_selfplay_soak=PASS startIndex=0 games=8' /tmp/selfplay-0.log
          grep -Fq 'ai_selfplay_soak=PASS startIndex=8 games=8' /tmp/selfplay-8.log

          python - <<'PY'
          from pathlib import Path
          import re
          text=Path('/tmp/selfplay-0.log').read_text()+Path('/tmp/selfplay-8.log').read_text()
          games=sorted(map(int,re.findall(r'^selfplay_game=(\d+)',text,re.M)))
          assert games==list(range(16)), games
          for difficulty in range(1,5):
              assert re.search(rf'^selfplay_game=\d+ difficulty={difficulty} ',text,re.M), difficulty
          assert text.count('ai_selfplay_soak=PASS')==2
          print('ai_selfplay_sharded_coverage=PASS games=16 indices=0-15 difficulties=1-4 maxRounds=80 shards=2')
          PY
          echo phase4r4_selfplay_completion=PASS
      - name: Preserve JVM gate result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini4x-phase4r4-selfplay-result
          path: phase4r4-selfplay-results.txt
          retention-days: 7
