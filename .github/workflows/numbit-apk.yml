name: Temporary Numbit APK Build

on:
  push:
    branches: [numbit-apk-build]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install signing tools
        run: sdkmanager 'build-tools;36.0.0'
      - name: Download last verified Numbit APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/numbit-source
          gh run download 31252218159 --repo '${{ github.repository }}' -n Numbit-APK -D /tmp/numbit-source
          find /tmp/numbit-source -maxdepth 2 -type f -ls
          src=$(find /tmp/numbit-source -type f -name '*.apk' | head -n1)
          test -n "$src"
          cp "$src" /tmp/Numbit-stripped.apk
      - name: Keep ARM phone architectures only
        run: |
          zip -d /tmp/Numbit-stripped.apk 'lib/x86/*' 'lib/x86_64/*' 'META-INF/*.SF' 'META-INF/*.RSA' 'META-INF/*.DSA' 'META-INF/MANIFEST.MF' || true
          unzip -l /tmp/Numbit-stripped.apk | grep 'lib/' | head -n 30
      - name: Align and sign compact APK
        run: |
          keytool -genkeypair -keystore /tmp/numbit.keystore -storepass android -keypass android -alias numbit -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Numbit,O=Numbit,C=AU'
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/zipalign" -P 16 -f -v 4 /tmp/Numbit-stripped.apk /tmp/Numbit-aligned.apk
          "$BT/apksigner" sign --ks /tmp/numbit.keystore --ks-key-alias numbit --ks-pass pass:android --key-pass pass:android --out Numbit.apk /tmp/Numbit-aligned.apk
          "$BT/apksigner" verify --verbose --print-certs Numbit.apk
      - name: Validate size and package
        run: |
          test -s Numbit.apk
          bytes=$(stat -c%s Numbit.apk)
          echo "Final APK bytes: $bytes"
          ls -lh Numbit.apk
          test "$bytes" -lt 104857600
          sha256sum Numbit.apk
          unzip -l Numbit.apk | grep -q 'lib/arm64-v8a/'
          unzip -l Numbit.apk | grep -q 'lib/armeabi-v7a/'
          if unzip -l Numbit.apk | grep -q 'lib/x86'; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: Numbit-Drive-APK
          path: Numbit.apk
          if-no-files-found: error
          retention-days: 1
