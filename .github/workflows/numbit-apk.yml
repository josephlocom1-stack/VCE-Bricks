name: Temporary Numbit APK Build

on:
  push:
    branches: [numbit-apk-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: numbit-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npm run typecheck
      - name: Expo prebuild
        env:
          CI: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Build signed debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../Numbit.apk
      - name: Validate APK
        run: |
          test -s Numbit.apk
          file Numbit.apk
          sha256sum Numbit.apk | tee Numbit.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Numbit-APK
          path: |
            numbit-build/Numbit.apk
            numbit-build/Numbit.apk.sha256
          if-no-files-found: error
          retention-days: 1
