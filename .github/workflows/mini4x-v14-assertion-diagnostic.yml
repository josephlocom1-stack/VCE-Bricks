name: Temporary Mini4X V1.4 Assertion Diagnostic

on:
  push:
    branches: [mini4x-public-qa-temp]
    paths: ['.github/workflows/mini4x-v14-assertion-diagnostic.yml']

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-buildsrc, path: relay/buildsrc, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027530759'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-generator, path: relay/generator, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027780110'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v12, path: relay/v12, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027823008'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v13-ai, path: relay/v13-ai, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027879200'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v13-qa, path: relay/v13-qa, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027906449'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v14-scripts, path: relay/v14-scripts, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027949459'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-v14-assets, path: relay/v14-assets, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32027974246'}
      - uses: actions/download-artifact@v4
        with: {name: mini4x-qa-harness, path: relay/qa-harness, github-token: '${{ github.token }}', repository: josephlocom1-stack/VCE-Bricks, run-id: '32028004472'}

      - name: Reconstruct candidate
        shell: bash
        run: |
          set -euo pipefail
          for f in relay/*/*.tar.gz; do tar -xzf "$f"; done
          python -m pip install --disable-pip-version-check --quiet pillow numpy
          cat buildsrc/noassets.00.b64 buildsrc/noassets.01.b64 buildsrc/noassets.02.b64 buildsrc/noassets.03.b64 buildsrc/noassets.04a.b64 buildsrc/noassets.04b.b64 buildsrc/noassets.05.b64 buildsrc/noassets.06.b64 buildsrc/noassets.07.b64 buildsrc/noassets.08a.b64 buildsrc/noassets.08b.b64 buildsrc/noassets.09.b64 | base64 -d >/tmp/src.zip
          unzip -t /tmp/src.zip >/dev/null
          rm -rf project && mkdir project && unzip -q /tmp/src.zip -d project
          cat final-generator/generator.*.part >/tmp/generate.py
          mkdir -p project/app/src/main/assets/mini4x/atlases
          python /tmp/generate.py project/app/src/main/assets/mini4x/atlases >/dev/null
          MINI4X_PROJECT=project python v12-patch/apply_v12.py >/dev/null
          MINI4X_PROJECT=project python v13-ai/apply_v13_ai.py >/dev/null
          MINI4X_PROJECT=project python v13-qa/apply_v13_qa.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_full_roster_ai.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_ai_quality.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_play_ready.py >/dev/null
          MINI4X_PROJECT=project python v13-qa/apply_directional_facing.py >/dev/null
          MINI4X_PROJECT=project python v13-qa/apply_v13_ui_review_fixes.py >/dev/null
          MINI4X_PROJECT=project python v13-qa/apply_v13_action_review_fixes.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_diplomacy_ui.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_tile_actions_ui.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_result_lifecycle.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_command_reachability.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_game_flow_lifecycle.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_selection_lifecycle.py >/dev/null
          MINI4X_PROJECT=project python v14-ai/apply_v14_safe_new_game.py >/dev/null
          MINI4X_PROJECT=project python qa/inject_emulator_scenarios.py >/dev/null

      - name: Label each sanity assertion
        shell: bash
        run: |
          set +e
          : > assertion-diagnostic.txt
          failures=0
          check(){ label="$1"; shift; if "$@" >/dev/null 2>&1; then echo "PASS $label" | tee -a assertion-diagnostic.txt; else echo "FAIL $label" | tee -a assertion-diagnostic.txt; failures=$((failures+1)); fi; }
          check version_name grep -q 'versionName = "1.4.0"' project/app/build.gradle.kts
          check version_code grep -q 'versionCode = 15' project/app/build.gradle.kts
          check compile_sdk grep -q 'compileSdk = 36' project/app/build.gradle.kts
          check target_sdk grep -q 'targetSdk = 36' project/app/build.gradle.kts
          check agp_8_10_1 grep -q '8.10.1' project/build.gradle.kts
          check peace_safety grep -q 'Never break peace while our units are still inside' project/app/src/main/java/com/example/mini4x/ai/StrategicAi.kt
          check critical_threat grep -q 'criticalThreat' project/app/src/main/java/com/example/mini4x/ai/StrategicAi.kt
          check diplomacy_mode grep -q 'ScreenMode.DIPLOMACY' project/app/src/main/java/com/example/mini4x/presentation/GamePresenter.kt
          check diplomacy_draw grep -q 'private fun drawDiplomacy' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          check tile_context_label grep -q 'private fun tileContextLabel' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          check selection_reconcile grep -q 'private fun reconcileSelectionAfterCommand' project/app/src/main/java/com/example/mini4x/presentation/GamePresenter.kt
          check safe_new_game_marker grep -q 'preserve current save until START GAME' project/app/src/main/java/com/example/mini4x/ui/Mini4xView.kt
          check roster_manifest test -s project/app/src/main/assets/mini4x/v14_full_roster_ai_manifest.json
          check naval_master test -s project/app/src/main/assets/mini4x/v14_naval_ai_master.webp
          check locked_raft test -s project/app/src/main/assets/mini4x/v14_raft_styleA_locked.png
          echo "failure_count=$failures" | tee -a assertion-diagnostic.txt
          test "$failures" -eq 0

      - name: Preserve assertion diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mini4x-assertion-diagnostic
          path: assertion-diagnostic.txt
          retention-days: 1
          if-no-files-found: error
