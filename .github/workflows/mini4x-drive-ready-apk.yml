name: Build Drive-ready Mini4X APK

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mini4x-drive-ready-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: android-actions/setup-android@v3

      - name: Install Android build tools and current official Apktool
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0" "platforms;android-35"
          APKTOOL_URL="$(curl -fsSL https://api.github.com/repos/iBotPeaches/Apktool/releases/latest | python -c 'import json,sys; d=json.load(sys.stdin); print(next(a["browser_download_url"] for a in d["assets"] if a["name"].endswith(".jar")))')"
          echo "Using $APKTOOL_URL"
          curl -fsSL -L "$APKTOOL_URL" -o /tmp/apktool.jar
          java -jar /tmp/apktool.jar --version

      - name: Verify exact original APK
        shell: bash
        run: |
          set -euo pipefail
          APK=temporary-mini4x-relay/Mini4X-v1.1-final-test.apk
          EXPECTED='031a5be4908e1521fa6ee12f91b942c281128bbea50cac0e75057a2e58735e64'
          test "$(sha256sum "$APK" | awk '{print $1}')" = "$EXPECTED"
          unzip -t "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/original-badging.txt
          for f in cities fog tech tiles units; do unzip -p "$APK" "assets/mini4x/atlases/$f.webp" > "/tmp/$f.webp"; done
          test "$(sha256sum /tmp/cities.webp | awk '{print $1}')" = 'ac5d80cd9f05e0b9687b5852c53d3bbd584115dd1773a0687ab52ae6fd73e925'
          test "$(sha256sum /tmp/fog.webp | awk '{print $1}')" = '1cef784fb3dc52d432105b60ab17da1f3a7fa22e9459b1468e9cb2af254df94b'
          test "$(sha256sum /tmp/tech.webp | awk '{print $1}')" = '132a901174d17182f56c304e8c33744331df451e702f858454429ebab8da6b3f'
          test "$(sha256sum /tmp/tiles.webp | awk '{print $1}')" = '89e16667d0df1a6a8a19a687a01d2109a9181a6681a98614aee00d0b5f3e6743'
          test "$(sha256sum /tmp/units.webp | awk '{print $1}')" = '7ec984977f1730576a3669204fd1aee705a47a4887c4f5a980762fd54c438116'

      - name: Decode and patch only test target SDK
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar d -f temporary-mini4x-relay/Mini4X-v1.1-final-test.apk -o decoded
          grep -A8 -n '^sdkInfo:' decoded/apktool.yml || true
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('decoded/apktool.yml')
          s = p.read_text()
          n, count = re.subn(r'(?m)^(\s*targetSdkVersion:\s*["\x27]?)35(["\x27]?\s*)$', r'\g<1>29\2', s)
          assert count == 1, ('targetSdkVersion 35 patch count', count)
          p.write_text(n)
          PY
          grep -A8 -n '^sdkInfo:' decoded/apktool.yml || true

      - name: Rebuild and JAR-sign Drive-safe APK
        shell: bash
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b decoded -o /tmp/Mini4X-v1.1-drive-unsigned.apk
          keytool -genkeypair -keystore /tmp/mini4x-drive.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -dname 'CN=Mini4X Test,O=Mini4X,C=AU' \
            -keyalg RSA -keysize 2048 -validity 10000 -noprompt
          jarsigner -keystore /tmp/mini4x-drive.keystore \
            -storepass android -keypass android \
            -sigalg SHA256withRSA -digestalg SHA-256 \
            /tmp/Mini4X-v1.1-drive-unsigned.apk androiddebugkey
          mv /tmp/Mini4X-v1.1-drive-unsigned.apk /tmp/Mini4X-v1.1-drive-signed.apk
          jarsigner -verify /tmp/Mini4X-v1.1-drive-signed.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/Mini4X-v1.1-drive-signed.apk | tee /tmp/prepack-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/prepack-signature.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging /tmp/Mini4X-v1.1-drive-signed.apk | tee /tmp/badging.txt
          grep -q "targetSdkVersion:'29'" /tmp/badging.txt
          rm -rf /tmp/rebuilt-atlases
          mkdir -p /tmp/rebuilt-atlases
          for f in cities fog tech tiles units; do unzip -p /tmp/Mini4X-v1.1-drive-signed.apk "assets/mini4x/atlases/$f.webp" > "/tmp/rebuilt-atlases/$f.webp"; done
          test "$(sha256sum /tmp/rebuilt-atlases/cities.webp | awk '{print $1}')" = 'ac5d80cd9f05e0b9687b5852c53d3bbd584115dd1773a0687ab52ae6fd73e925'
          test "$(sha256sum /tmp/rebuilt-atlases/fog.webp | awk '{print $1}')" = '1cef784fb3dc52d432105b60ab17da1f3a7fa22e9459b1468e9cb2af254df94b'
          test "$(sha256sum /tmp/rebuilt-atlases/tech.webp | awk '{print $1}')" = '132a901174d17182f56c304e8c33744331df451e702f858454429ebab8da6b3f'
          test "$(sha256sum /tmp/rebuilt-atlases/tiles.webp | awk '{print $1}')" = '89e16667d0df1a6a8a19a687a01d2109a9181a6681a98614aee00d0b5f3e6743'
          test "$(sha256sum /tmp/rebuilt-atlases/units.webp | awk '{print $1}')" = '7ec984977f1730576a3669204fd1aee705a47a4887c4f5a980762fd54c438116'
          rm -rf apkroot
          mkdir apkroot
          unzip -q /tmp/Mini4X-v1.1-drive-signed.apk -d apkroot

      - name: Upload APK root as artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mini4X-v1.1-drive-ready-apk
          path: apkroot/
          compression-level: 6
          retention-days: 7
          if-no-files-found: error

      - name: Verify downloaded artifact is itself a valid APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ID=''
          for i in {1..15}; do
            ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="Mini4X-v1.1-drive-ready-apk") | .id' | head -1)"
            [ -n "$ID" ] && break
            sleep 2
          done
          test -n "$ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip" > /tmp/Mini4X-v1.1-drive-ready.apk
          unzip -t /tmp/Mini4X-v1.1-drive-ready.apk
          jarsigner -verify /tmp/Mini4X-v1.1-drive-ready.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs /tmp/Mini4X-v1.1-drive-ready.apk | tee /tmp/postpack-signature.txt
          grep -q 'Verified using v1 scheme (JAR signing): true' /tmp/postpack-signature.txt
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging /tmp/Mini4X-v1.1-drive-ready.apk | tee /tmp/postpack-badging.txt
          grep -q "targetSdkVersion:'29'" /tmp/postpack-badging.txt
          rm -rf /tmp/post-atlases
          mkdir -p /tmp/post-atlases
          for f in cities fog tech tiles units; do unzip -p /tmp/Mini4X-v1.1-drive-ready.apk "assets/mini4x/atlases/$f.webp" > "/tmp/post-atlases/$f.webp"; done
          test "$(sha256sum /tmp/post-atlases/cities.webp | awk '{print $1}')" = 'ac5d80cd9f05e0b9687b5852c53d3bbd584115dd1773a0687ab52ae6fd73e925'
          test "$(sha256sum /tmp/post-atlases/fog.webp | awk '{print $1}')" = '1cef784fb3dc52d432105b60ab17da1f3a7fa22e9459b1468e9cb2af254df94b'
          test "$(sha256sum /tmp/post-atlases/tech.webp | awk '{print $1}')" = '132a901174d17182f56c304e8c33744331df451e702f858454429ebab8da6b3f'
          test "$(sha256sum /tmp/post-atlases/tiles.webp | awk '{print $1}')" = '89e16667d0df1a6a8a19a687a01d2109a9181a6681a98614aee00d0b5f3e6743'
          test "$(sha256sum /tmp/post-atlases/units.webp | awk '{print $1}')" = '7ec984977f1730576a3669204fd1aee705a47a4887c4f5a980762fd54c438116'
          echo "ARTIFACT_ID=$ID"
          stat -c 'APK_SIZE=%s' /tmp/Mini4X-v1.1-drive-ready.apk
          sha256sum /tmp/Mini4X-v1.1-drive-ready.apk
